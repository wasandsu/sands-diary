<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>샌즈 건강 수첩</title>
<meta name="theme-color" content="#6B4226">
<meta name="description" content="비글 샌즈의 몸무게, 산책, 구충제, 병원 기록을 관리하는 개인용 앱">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="샌즈수첩">
<link rel="icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #EFE3C8;
  font-family: 'Noto Sans KR', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

.sd-app {
  --paper: #FBF3E4;
  --paper-2: #F3E7CE;
  --ink: #2B241C;
  --ink-soft: #6B5D48;
  --tan: #C99A5B;
  --brown: #6B4226;
  --stamp: #B23A2E;
  --stamp-soft: #E7C9BE;
  --line: #D8C7A6;
  --green: #5C7A4E;
  color: var(--ink);
  background: var(--paper);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(107,66,38,0.06) 1px, transparent 0);
  background-size: 14px 14px;
  border-radius: 0;
  padding: 0;
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
  overflow: hidden;
}

/* ---------- Header / ID card ---------- */
.sd-header {
  position: relative;
  padding: calc(18px + env(safe-area-inset-top)) 22px 18px;
  background: linear-gradient(180deg, var(--paper-2), var(--paper));
  border-bottom: 2px dashed var(--line);
}
.sd-eyebrow {
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
  font-weight: 600;
  margin-bottom: 6px;
}
.sd-titlebar {
  display: flex;
  align-items: center;
  gap: 14px;
}
.sd-avatar {
  width: 58px; height: 58px;
  border-radius: 50%;
  background: var(--tan);
  border: 2px solid var(--brown);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
  cursor: pointer;
  overflow: hidden;
  padding: 0;
}
.sd-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.sd-avatar .sd-avatar-edit {
  position: absolute;
  bottom: -2px; right: -2px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--stamp);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  border: 2px solid var(--paper);
}
.sd-name-row { flex: 1; min-width: 0; }
.sd-name {
  font-family: 'Gowun Batang', serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.1;
}
.sd-breed {
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 2px;
}
.sd-editbtn {
  border: 1px solid var(--brown);
  background: transparent;
  color: var(--brown);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
}
.sd-editbtn:hover { background: var(--brown); color: var(--paper); }

.sd-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 16px;
}
.sd-stat {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  text-align: center;
}
.sd-stat-label { font-size: 10.5px; color: var(--ink-soft); font-weight: 500; }
.sd-stat-value { font-family: 'Gowun Batang', serif; font-size: 18px; margin-top: 2px; }

.sd-note {
  margin-top: 12px;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.5;
  min-height: 18px;
}

.sd-installbar {
  display: none;
  margin-top: 12px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--stamp-soft);
  border: 1px solid var(--stamp);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 12px;
}
.sd-installbar.show { display: flex; }
.sd-installbar button {
  background: var(--stamp);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

/* ---------- Edit form ---------- */
.sd-editform {
  margin-top: 14px;
  padding: 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  display: none;
}
.sd-editform.open { display: block; }
.sd-editform .sd-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.sd-field label { font-size: 11px; color: var(--ink-soft); display: block; margin-bottom: 4px; font-weight: 600; }
.sd-field input, .sd-field textarea, .sd-field select {
  width: 100%;
  font-family: inherit;
  font-size: 13.5px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
}
.sd-field textarea { resize: vertical; min-height: 44px; }
.sd-formbtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

/* ---------- Buttons ---------- */
.sd-btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
}
.sd-btn-primary { background: var(--stamp); color: #fff; }
.sd-btn-primary:hover { background: #963026; }
.sd-btn-ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
.sd-btn-ghost:hover { background: var(--paper-2); }

/* ---------- Tabs ---------- */
.sd-tabs {
  display: flex;
  gap: 6px;
  padding: 14px 16px 0;
  overflow-x: auto;
}
.sd-tab {
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px 999px 0 0;
  background: var(--paper-2);
  color: var(--ink-soft);
  cursor: pointer;
  border: 1px solid var(--line);
  border-bottom: none;
  white-space: nowrap;
}
.sd-tab.active {
  background: var(--paper);
  color: var(--ink);
  position: relative;
  top: 1px;
}

/* ---------- Add record ---------- */
.sd-addbar {
  margin: 14px 16px 0;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
}
.sd-addbar-row { display: grid; grid-template-columns: 100px 1fr 110px; gap: 8px; }
.sd-addbar-row2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }

/* ---------- Timeline ---------- */
.sd-timeline {
  padding: 16px;
  min-height: 120px;
  max-height: 46vh;
  overflow-y: auto;
}
.sd-empty {
  text-align: center;
  color: var(--ink-soft);
  font-size: 13px;
  padding: 30px 10px;
  line-height: 1.6;
}
.sd-entry {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  animation: sd-in 0.25s ease;
}
@keyframes sd-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.sd-entry:last-child { border-bottom: none; }
.sd-stampicon {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  border: 2px solid currentColor;
  transform: rotate(-6deg);
}
.sd-entry-body { flex: 1; min-width: 0; }
.sd-entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sd-entry-type { font-size: 13px; font-weight: 700; }
.sd-entry-date { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
.sd-entry-memo { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; line-height: 1.45; word-break: break-word; }
.sd-entry-del {
  background: none; border: none; color: var(--ink-soft);
  cursor: pointer; font-size: 11px; margin-top: 4px; padding: 0;
  text-decoration: underline;
}
.sd-entry-del:hover { color: var(--stamp); }

/* ---------- Sync status badge ---------- */
.sd-sync {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--line);
  cursor: default;
  user-select: none;
}
.sd-sync-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ink-soft);
  flex-shrink: 0;
}
.sd-sync.is-synced { color: var(--green); border-color: #BFD1AF; }
.sd-sync.is-synced .sd-sync-dot { background: var(--green); }
.sd-sync.is-syncing { color: var(--tan); }
.sd-sync.is-syncing .sd-sync-dot { background: var(--tan); animation: sd-pulse 1s ease-in-out infinite; }
.sd-sync.is-offline { color: var(--stamp); border-color: var(--stamp-soft); }
.sd-sync.is-offline .sd-sync-dot { background: var(--stamp); }
@keyframes sd-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ---------- Backup / data tools ---------- */
.sd-datatools {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.sd-datatools .sd-btn { flex: 1; text-align: center; }

/* ---------- Toast ---------- */
.sd-toast-wrap {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: calc(100% - 40px);
  max-width: 420px;
}
.sd-toast {
  background: var(--ink);
  color: var(--paper);
  font-size: 13px;
  font-weight: 600;
  padding: 11px 16px;
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(43,36,28,0.3);
  display: flex;
  align-items: center;
  gap: 12px;
  animation: sd-toast-in 0.2s ease;
  pointer-events: auto;
  max-width: 100%;
}
.sd-toast.is-out { animation: sd-toast-out 0.2s ease forwards; }
.sd-toast-msg { flex: 1; min-width: 0; }
.sd-toast-action {
  background: none;
  border: none;
  color: var(--tan);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  padding: 0;
  font-family: inherit;
}
@keyframes sd-toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes sd-toast-out { to { opacity: 0; transform: translateY(10px); } }

.sd-footer {
  text-align: center;
  font-size: 10.5px;
  color: var(--ink-soft);
  padding: 8px 0 calc(14px + env(safe-area-inset-bottom));
  opacity: 0.7;
}

@media (max-width: 420px) {
  .sd-addbar-row { grid-template-columns: 1fr; }
  .sd-stats { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div class="sd-app" id="sdApp">
  <div class="sd-header">
    <div class="sd-eyebrow">🐾 반려견 건강 수첩</div>
    <div class="sd-titlebar">
      <button class="sd-avatar" id="sdAvatarBtn" type="button" aria-label="프로필 사진 변경" title="눌러서 사진 바꾸기">
        <svg id="sdAvatarSvg" width="34" height="34" viewBox="0 0 64 64" fill="none">
          <ellipse cx="32" cy="38" rx="18" ry="14" fill="#6B4226"/>
          <ellipse cx="22" cy="24" rx="7" ry="12" fill="#6B4226" transform="rotate(-20 22 24)"/>
          <ellipse cx="42" cy="24" rx="7" ry="12" fill="#6B4226" transform="rotate(20 42 24)"/>
          <circle cx="32" cy="34" r="12" fill="#F3E7CE"/>
          <circle cx="27" cy="33" r="1.6" fill="#2B241C"/>
          <circle cx="37" cy="33" r="1.6" fill="#2B241C"/>
          <ellipse cx="32" cy="38" rx="2.4" ry="1.8" fill="#2B241C"/>
        </svg>
        <img id="sdAvatarImg" style="display:none;" alt="샌즈 사진">
        <span class="sd-avatar-edit">✎</span>
      </button>
      <input type="file" id="sdAvatarInput" accept="image/*" style="display:none;">
      <div class="sd-name-row">
        <div class="sd-name" id="sdName">샌즈</div>
        <div class="sd-breed" id="sdBreed">비글 · 나이 -</div>
      </div>
      <button class="sd-editbtn" id="sdEditToggle">프로필 수정</button>
    </div>

    <div class="sd-stats">
      <div class="sd-stat"><div class="sd-stat-label">몸무게</div><div class="sd-stat-value" id="sdWeight">- kg</div></div>
      <div class="sd-stat"><div class="sd-stat-label">몸 길이</div><div class="sd-stat-value" id="sdLength">- cm</div></div>
      <div class="sd-stat"><div class="sd-stat-label">최근 산책</div><div class="sd-stat-value" id="sdLastWalk">-</div></div>
    </div>
    <div class="sd-note" id="sdNote">건강 상태 메모가 아직 없어요.</div>

    <div class="sd-installbar" id="sdInstallBar">
      <span>홈 화면에 추가하면 앱처럼 쓸 수 있어요</span>
      <button id="sdInstallBtn">추가</button>
    </div>

    <div class="sd-sync" id="sdSync" title="가족과 공유되는 동기화 상태예요">
      <span class="sd-sync-dot"></span>
      <span id="sdSyncText">동기화 상태 확인 중…</span>
    </div>

    <div class="sd-datatools">
      <button class="sd-btn sd-btn-ghost" id="sdExportBtn" type="button">⬇ 백업 내보내기</button>
      <button class="sd-btn sd-btn-ghost" id="sdImportBtn" type="button">⬆ 백업 가져오기</button>
      <input type="file" id="sdImportInput" accept="application/json,.json" style="display:none;">
    </div>

    <div class="sd-editform" id="sdEditForm">
      <div class="sd-row">
        <div class="sd-field"><label>이름</label><input type="text" id="fName" value="샌즈"></div>
        <div class="sd-field"><label>견종</label><input type="text" id="fBreed" value="비글"></div>
      </div>
      <div class="sd-row">
        <div class="sd-field"><label>생년월일</label><input type="date" id="fBirth"></div>
        <div class="sd-field"><label>몸 길이 (cm)</label><input type="number" step="0.1" id="fLength" placeholder="예: 45"></div>
      </div>
      <div class="sd-row">
        <div class="sd-field"><label>현재 몸무게 (kg)</label><input type="number" step="0.1" id="fWeight" placeholder="예: 10.5"></div>
        <div class="sd-field"><label>&nbsp;</label></div>
      </div>
      <div class="sd-field"><label>건강 상태 메모</label><textarea id="fNote" placeholder="알레르기, 지병, 특이사항 등을 적어주세요"></textarea></div>
      <div class="sd-formbtns">
        <button class="sd-btn sd-btn-ghost" id="sdRemovePhoto" style="margin-right:auto;">사진 삭제</button>
        <button class="sd-btn sd-btn-ghost" id="sdCancelEdit">취소</button>
        <button class="sd-btn sd-btn-primary" id="sdSaveProfile">저장</button>
      </div>
    </div>
  </div>

  <div class="sd-tabs" id="sdTabs"></div>

  <div class="sd-addbar">
    <div class="sd-addbar-row">
      <select id="aType">
        <option value="walk">🐾 산책</option>
        <option value="deworm">💊 구충제</option>
        <option value="vet">🏥 병원</option>
        <option value="weight">⚖️ 몸무게</option>
      </select>
      <input type="text" id="aMemo" placeholder="메모 (예: 동네 공원 30분, 심장사상충 약)">
      <input type="date" id="aDate">
    </div>
    <div class="sd-addbar-row2">
      <input type="number" step="0.1" id="aWeightVal" placeholder="몸무게(kg) — '몸무게' 유형일 때만" style="display:none;">
      <button class="sd-btn sd-btn-primary" id="sdAddBtn">기록 추가</button>
    </div>
  </div>

  <div class="sd-timeline" id="sdTimeline">
    <div class="sd-empty">불러오는 중...</div>
  </div>
  <div class="sd-footer">샌즈의 건강 수첩 · 가족과 함께 기록하고 이 기기에도 저장돼요</div>
</div>

<div class="sd-toast-wrap" id="sdToastWrap"></div>

<script>
(function() {
  // ======== Supabase 가족 공유 설정 ========
  // publishable 키는 공개돼도 안전한 키라 여기에 넣어도 됩니다.
  // 가족(아내분)과 같은 FAMILY_CODE로 접속하면 같은 기록을 공유해요.
  const SUPABASE_URL = 'https://raanvzdmhrhyxewciijn.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_u8iFaLpMYmYU3c6ZKVSz8Q_sluGgM_m';
  const FAMILY_CODE  = 'sands-0113';
  const CLOUD_ENABLED = !!(SUPABASE_URL && SUPABASE_KEY && FAMILY_CODE);
  const REST = SUPABASE_URL + '/rest/v1';

  const STORAGE_PROFILE = 'sands_profile';
  const STORAGE_RECORDS = 'sands_records';
  const STORAGE_PHOTO = 'sands_photo';

  const TYPE_META = {
    walk:   { label: '산책',   icon: '🐾', color: '#5C7A4E' },
    deworm: { label: '구충제', icon: '💊', color: '#B58C1E' },
    vet:    { label: '병원',   icon: '🏥', color: '#B23A2E' },
    weight: { label: '몸무게', icon: '⚖️', color: '#6B4226' },
  };

  let profile = { name: '샌즈', breed: '비글', birth: '', weight: '', length: '', note: '' };
  let records = [];
  let activeTab = 'all';

  const $ = (id) => document.getElementById(id);

  // ======== Toast ========
  function toast(msg, opts) {
    opts = opts || {};
    const wrap = $('sdToastWrap');
    if (!wrap) return;
    const el = document.createElement('div');
    el.className = 'sd-toast';
    const span = document.createElement('span');
    span.className = 'sd-toast-msg';
    span.textContent = msg;
    el.appendChild(span);
    if (opts.actionLabel && typeof opts.onAction === 'function') {
      const btn = document.createElement('button');
      btn.className = 'sd-toast-action';
      btn.textContent = opts.actionLabel;
      btn.addEventListener('click', () => {
        try { opts.onAction(); } finally { remove(); }
      });
      el.appendChild(btn);
    }
    wrap.appendChild(el);
    let removed = false;
    function remove() {
      if (removed) return;
      removed = true;
      el.classList.add('is-out');
      setTimeout(() => el.remove(), 220);
    }
    setTimeout(remove, opts.duration || 3200);
    return remove;
  }

  // ======== Sync status badge ========
  function setSyncStatus(state, text) {
    const el = $('sdSync');
    if (!el) return;
    el.classList.remove('is-synced', 'is-syncing', 'is-offline');
    if (state) el.classList.add(state);
    $('sdSyncText').textContent = text;
  }

  // ======== Supabase REST helpers ========
  // 새 publishable 키는 apikey 헤더로만 보냅니다 (Authorization Bearer 불필요).
  function sbHeaders(extra) {
    return Object.assign({
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json',
    }, extra || {});
  }

  async function cloudFetchAll() {
    // 프로필과 기록을 family_code로 가져옵니다.
    const [profRes, recRes] = await Promise.all([
      fetch(`${REST}/profile?family_code=eq.${encodeURIComponent(FAMILY_CODE)}&select=data`, {
        headers: sbHeaders(),
      }),
      fetch(`${REST}/records?family_code=eq.${encodeURIComponent(FAMILY_CODE)}&select=id,type,date,memo,weight&order=date.desc`, {
        headers: sbHeaders(),
      }),
    ]);
    if (!profRes.ok) throw new Error('profile fetch ' + profRes.status);
    if (!recRes.ok) throw new Error('records fetch ' + recRes.status);
    const profRows = await profRes.json();
    const recRows = await recRes.json();
    return {
      profile: (profRows[0] && profRows[0].data) ? profRows[0].data : null,
      records: Array.isArray(recRows) ? recRows.map(normalizeRecord) : [],
    };
  }

  function normalizeRecord(r) {
    const out = { id: Number(r.id), type: r.type, date: r.date, memo: r.memo || '' };
    if (r.weight !== undefined && r.weight !== null && r.weight !== '') out.weight = String(r.weight);
    return out;
  }

  async function cloudUpsertProfile(p) {
    const res = await fetch(`${REST}/profile?on_conflict=family_code`, {
      method: 'POST',
      headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ family_code: FAMILY_CODE, data: p, updated_at: new Date().toISOString() }),
    });
    if (!res.ok) throw new Error('profile upsert ' + res.status);
  }

  async function cloudUpsertRecord(entry) {
    const row = {
      id: entry.id,
      family_code: FAMILY_CODE,
      type: entry.type,
      date: entry.date,
      memo: entry.memo || '',
      weight: entry.weight != null ? String(entry.weight) : '',
    };
    const res = await fetch(`${REST}/records?on_conflict=id`, {
      method: 'POST',
      headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(row),
    });
    if (!res.ok) throw new Error('record upsert ' + res.status);
  }

  async function cloudDeleteRecord(id) {
    const res = await fetch(`${REST}/records?id=eq.${encodeURIComponent(id)}&family_code=eq.${encodeURIComponent(FAMILY_CODE)}`, {
      method: 'DELETE',
      headers: sbHeaders({ 'Prefer': 'return=minimal' }),
    });
    if (!res.ok) throw new Error('record delete ' + res.status);
  }

  // 클라우드에서 최신 데이터를 당겨와 로컬과 병합(클라우드 우선)
  async function pullFromCloud(opts) {
    opts = opts || {};
    if (!CLOUD_ENABLED) { setSyncStatus('', '기기에만 저장 중'); return; }
    if (!navigator.onLine) { setSyncStatus('is-offline', '오프라인 · 이 기기에 저장됨'); return; }
    setSyncStatus('is-syncing', '동기화 중…');
    try {
      const cloud = await cloudFetchAll();
      if (cloud.profile) {
        profile = { ...profile, ...cloud.profile };
        saveProfileLocal();
      }
      records = cloud.records;
      saveRecordsLocal();
      renderProfile();
      renderTabs();
      renderTimeline();
      setSyncStatus('is-synced', '가족과 동기화됨 🐾');
      if (opts.notify) toast('최신 기록을 불러왔어요');
    } catch (e) {
      console.error('클라우드 동기화 실패', e);
      setSyncStatus('is-offline', '동기화 실패 · 이 기기에 저장됨');
      if (opts.notify) toast('동기화에 실패했어요. 잠시 후 다시 시도해요.');
    }
  }

  function todayStr() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }

  function ageString(birth) {
    if (!birth) return '나이 -';
    const b = new Date(birth);
    const now = new Date();
    let years = now.getFullYear() - b.getFullYear();
    let months = now.getMonth() - b.getMonth();
    if (now.getDate() < b.getDate()) months -= 1;
    if (months < 0) { years -= 1; months += 12; }
    if (years < 0) return '나이 -';
    return years > 0 ? `${years}살 ${months}개월` : `${months}개월`;
  }

  function loadData() {
    try {
      const p = localStorage.getItem(STORAGE_PROFILE);
      if (p) profile = { ...profile, ...JSON.parse(p) };
    } catch (e) { console.error('프로필 불러오기 실패', e); }
    try {
      const r = localStorage.getItem(STORAGE_RECORDS);
      if (r) records = JSON.parse(r);
    } catch (e) { console.error('기록 불러오기 실패', e); records = []; }
    renderProfile();
    renderTabs();
    renderTimeline();
    renderAvatar();
    // 로컬을 먼저 그린 뒤 클라우드에서 최신 데이터를 당겨옵니다 (local-first)
    pullFromCloud();
  }

  function renderAvatar() {
    let photo = null;
    try { photo = localStorage.getItem(STORAGE_PHOTO); } catch (e) { /* ignore */ }
    if (photo) {
      $('sdAvatarImg').src = photo;
      $('sdAvatarImg').style.display = 'block';
      $('sdAvatarSvg').style.display = 'none';
    } else {
      $('sdAvatarImg').style.display = 'none';
      $('sdAvatarSvg').style.display = 'block';
    }
  }

  function resizeImageToDataUrl(file, maxSize) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('파일을 읽지 못했어요'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('이미지를 열지 못했어요'));
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxSize) {
            height = Math.round(height * (maxSize / width));
            width = maxSize;
          } else if (height > maxSize) {
            width = Math.round(width * (maxSize / height));
            height = maxSize;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function saveProfileLocal() {
    try {
      localStorage.setItem(STORAGE_PROFILE, JSON.stringify(profile));
    } catch (e) { console.error('프로필 저장 실패', e); alert('저장에 실패했어요. 저장 공간이 부족할 수 있어요.'); }
  }

  function saveRecordsLocal() {
    try {
      localStorage.setItem(STORAGE_RECORDS, JSON.stringify(records));
    } catch (e) { console.error('기록 저장 실패', e); alert('저장에 실패했어요. 저장 공간이 부족할 수 있어요.'); }
  }

  // 로컬에 즉시 저장하고, 클라우드에도 반영 (실패해도 로컬은 유지)
  function saveProfile() {
    saveProfileLocal();
    if (CLOUD_ENABLED && navigator.onLine) {
      setSyncStatus('is-syncing', '동기화 중…');
      cloudUpsertProfile(profile)
        .then(() => setSyncStatus('is-synced', '가족과 동기화됨 🐾'))
        .catch((e) => { console.error(e); setSyncStatus('is-offline', '동기화 실패 · 이 기기에 저장됨'); });
    }
  }

  function saveRecords() {
    saveRecordsLocal();
  }

  function renderProfile() {
    $('sdName').textContent = profile.name || '샌즈';
    $('sdBreed').textContent = `${profile.breed || '비글'} · ${ageString(profile.birth)}`;
    $('sdWeight').textContent = profile.weight ? `${profile.weight} kg` : '- kg';
    $('sdLength').textContent = profile.length ? `${profile.length} cm` : '- cm';
    $('sdNote').textContent = profile.note ? profile.note : '건강 상태 메모가 아직 없어요.';

    const lastWalk = records
      .filter(r => r.type === 'walk')
      .sort((a, b) => b.date.localeCompare(a.date))[0];
    $('sdLastWalk').textContent = lastWalk ? lastWalk.date.slice(5) : '-';

    $('fName').value = profile.name || '';
    $('fBreed').value = profile.breed || '';
    $('fBirth').value = profile.birth || '';
    $('fWeight').value = profile.weight || '';
    $('fLength').value = profile.length || '';
    $('fNote').value = profile.note || '';
  }

  function renderTabs() {
    const tabs = [{ key: 'all', label: '전체' }, ...Object.keys(TYPE_META).map(k => ({ key: k, label: TYPE_META[k].icon + ' ' + TYPE_META[k].label }))];
    $('sdTabs').innerHTML = tabs.map(t =>
      `<div class="sd-tab ${t.key === activeTab ? 'active' : ''}" data-tab="${t.key}">${t.label}</div>`
    ).join('');
    $('sdTabs').querySelectorAll('.sd-tab').forEach(el => {
      el.addEventListener('click', () => {
        activeTab = el.dataset.tab;
        renderTabs();
        renderTimeline();
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderTimeline() {
    const list = records
      .filter(r => activeTab === 'all' || r.type === activeTab)
      .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    if (list.length === 0) {
      $('sdTimeline').innerHTML = `<div class="sd-empty">아직 기록이 없어요.<br>위에서 첫 기록을 추가해보세요 🐾</div>`;
      return;
    }

    $('sdTimeline').innerHTML = list.map(r => {
      const meta = TYPE_META[r.type] || TYPE_META.walk;
      const weightPart = r.type === 'weight' && r.weight ? `${r.weight} kg` : '';
      const memo = [weightPart, r.memo].filter(Boolean).join(' · ');
      return `
        <div class="sd-entry">
          <div class="sd-stampicon" style="color:${meta.color}">${meta.icon}</div>
          <div class="sd-entry-body">
            <div class="sd-entry-top">
              <div class="sd-entry-type" style="color:${meta.color}">${meta.label}</div>
              <div class="sd-entry-date">${r.date}</div>
            </div>
            ${memo ? `<div class="sd-entry-memo">${escapeHtml(memo)}</div>` : ''}
            <button class="sd-entry-del" data-id="${r.id}">삭제</button>
          </div>
        </div>`;
    }).join('');

    $('sdTimeline').querySelectorAll('.sd-entry-del').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.id);
        const removed = records.find(r => r.id === id);
        if (!removed) return;
        const removedIndex = records.indexOf(removed);
        records = records.filter(r => r.id !== id);
        saveRecords();
        renderProfile();
        renderTimeline();
        if (CLOUD_ENABLED && navigator.onLine) {
          cloudDeleteRecord(id).catch((e) => {
            console.error('클라우드 삭제 실패', e);
            setSyncStatus('is-offline', '삭제 동기화 실패 · 이 기기엔 반영됨');
          });
        }
        // 실행 취소(undo) 토스트
        toast('기록을 삭제했어요', {
          actionLabel: '되돌리기',
          duration: 5000,
          onAction: () => {
            records.splice(Math.min(removedIndex, records.length), 0, removed);
            saveRecords();
            renderProfile();
            renderTimeline();
            if (CLOUD_ENABLED && navigator.onLine) {
              cloudUpsertRecord(removed).catch((e) => console.error('복구 동기화 실패', e));
            }
          },
        });
      });
    });
  }

  // Edit profile toggle
  $('sdEditToggle').addEventListener('click', () => {
    $('sdEditForm').classList.toggle('open');
  });
  $('sdCancelEdit').addEventListener('click', () => {
    $('sdEditForm').classList.remove('open');
    renderProfile();
  });
  $('sdSaveProfile').addEventListener('click', () => {
    profile = {
      name: $('fName').value.trim() || '샌즈',
      breed: $('fBreed').value.trim() || '비글',
      birth: $('fBirth').value,
      weight: $('fWeight').value,
      length: $('fLength').value,
      note: $('fNote').value.trim(),
    };
    saveProfile();
    renderProfile();
    $('sdEditForm').classList.remove('open');
    toast('프로필을 저장했어요');
  });

  // ---- Avatar photo ----
  $('sdAvatarBtn').addEventListener('click', () => {
    $('sdAvatarInput').click();
  });
  $('sdAvatarInput').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const dataUrl = await resizeImageToDataUrl(file, 400);
      try {
        localStorage.setItem(STORAGE_PHOTO, dataUrl);
        renderAvatar();
      } catch (err) {
        console.error('사진 저장 실패', err);
        alert('사진 저장에 실패했어요. 용량이 너무 클 수 있어요.');
      }
    } catch (err) {
      console.error(err);
      alert('사진을 불러오지 못했어요.');
    }
  });
  $('sdRemovePhoto').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_PHOTO);
    renderAvatar();
  });

  // Add record type toggle for weight field
  $('aType').addEventListener('change', () => {
    $('aWeightVal').style.display = $('aType').value === 'weight' ? 'block' : 'none';
  });

  $('sdAddBtn').addEventListener('click', () => {
    const type = $('aType').value;
    const date = $('aDate').value || todayStr();
    const memo = $('aMemo').value.trim();
    const weightVal = $('aWeightVal').value;

    if (type === 'weight' && !weightVal && !memo) {
      alert('몸무게 값을 입력해주세요.');
      return;
    }

    const entry = { id: Date.now(), type, date, memo };
    if (type === 'weight' && weightVal) {
      entry.weight = weightVal;
      profile.weight = weightVal;
      saveProfile();
    }
    records.push(entry);
    saveRecords();

    $('aMemo').value = '';
    $('aWeightVal').value = '';
    renderProfile();
    renderTimeline();

    // 클라우드에 반영
    if (CLOUD_ENABLED && navigator.onLine) {
      setSyncStatus('is-syncing', '동기화 중…');
      cloudUpsertRecord(entry)
        .then(() => setSyncStatus('is-synced', '가족과 동기화됨 🐾'))
        .catch((e) => { console.error(e); setSyncStatus('is-offline', '동기화 실패 · 이 기기에 저장됨'); });
    }
    toast('기록했어요 🐾');
  });

  // ---- 백업 내보내기 / 가져오기 ----
  function exportBackup() {
    let photo = null;
    try { photo = localStorage.getItem(STORAGE_PHOTO); } catch (e) { /* ignore */ }
    const backup = {
      app: 'sands-health-notebook',
      version: 1,
      exportedAt: new Date().toISOString(),
      profile,
      records,
      photo: photo || null,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `샌즈수첩_백업_${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('백업 파일을 저장했어요');
  }

  async function importBackup(file) {
    let data;
    try {
      const text = await file.text();
      data = JSON.parse(text);
    } catch (e) {
      alert('백업 파일을 읽지 못했어요. 올바른 JSON 파일인지 확인해주세요.');
      return;
    }
    if (!data || (!Array.isArray(data.records) && !data.profile)) {
      alert('샌즈 수첩 백업 파일이 아닌 것 같아요.');
      return;
    }
    if (!confirm('지금 기록을 이 백업 내용으로 덮어쓸까요?\n(현재 기기의 기록이 백업 내용으로 바뀝니다)')) return;

    if (data.profile && typeof data.profile === 'object') {
      profile = { ...profile, ...data.profile };
      saveProfileLocal();
    }
    if (Array.isArray(data.records)) {
      records = data.records.map(normalizeRecord);
      saveRecordsLocal();
    }
    if (data.photo) {
      try { localStorage.setItem(STORAGE_PHOTO, data.photo); } catch (e) { console.error('사진 복원 실패', e); }
    }
    renderProfile();
    renderTabs();
    renderTimeline();
    renderAvatar();
    toast('백업을 불러왔어요');

    // 복원한 내용을 클라우드에도 올려 가족과 공유
    if (CLOUD_ENABLED && navigator.onLine) {
      setSyncStatus('is-syncing', '동기화 중…');
      try {
        await cloudUpsertProfile(profile);
        for (const r of records) { await cloudUpsertRecord(r); }
        setSyncStatus('is-synced', '가족과 동기화됨 🐾');
        toast('복원한 기록을 가족과 공유했어요');
      } catch (e) {
        console.error('복원 후 동기화 실패', e);
        setSyncStatus('is-offline', '동기화 실패 · 이 기기엔 반영됨');
      }
    }
  }

  $('sdExportBtn').addEventListener('click', exportBackup);
  $('sdImportBtn').addEventListener('click', () => $('sdImportInput').click());
  $('sdImportInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) importBackup(file);
  });

  // ---- 연결 상태 변화 대응 ----
  window.addEventListener('online', () => {
    toast('다시 연결됐어요. 동기화할게요.');
    pullFromCloud();
  });
  window.addEventListener('offline', () => {
    setSyncStatus('is-offline', '오프라인 · 이 기기에 저장됨');
  });
  // 앱으로 돌아왔을 때 최신 기록 당겨오기 (가족이 추가한 기록 반영)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') pullFromCloud();
  });
  // 동기화 뱃지를 누르면 수동 새로고침
  $('sdSync').addEventListener('click', () => pullFromCloud({ notify: true }));

  $('aDate').value = todayStr();
  loadData();

  // ---- PWA install prompt ----
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    $('sdInstallBar').classList.add('show');
  });
  $('sdInstallBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    $('sdInstallBar').classList.remove('show');
  });
  window.addEventListener('appinstalled', () => {
    $('sdInstallBar').classList.remove('show');
  });

  // ---- Service worker registration ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((e) => console.error('SW 등록 실패', e));
    });
  }
})();
</script>
</body>
</html>
